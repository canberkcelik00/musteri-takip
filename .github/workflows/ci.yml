name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A run on main may be uploading to the hosting; it is never cancelled halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: musteri_takip_testing
          MYSQL_USER: musteri_takip
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: musteri_takip
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install front-end dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      - name: Pest
        run: composer test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The job pushes the built package to the production branch.
    permissions:
      contents: write

    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare environment
        run: cp .env.example .env

      # Composer scripts stay on: filament:upgrade writes Filament's public assets.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Install front-end dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Prepare package
        run: |
          items=()
          for item in app bootstrap config database lang public resources routes storage vendor artisan composer.json composer.lock .cpanel.yml; do
            if [ -e "$item" ]; then
              items+=("$item")
            fi
          done

          mkdir dist
          rsync -a --relative \
            --include='/bootstrap/cache/.gitignore' --exclude='/bootstrap/cache/*' \
            --include='/storage/**/' --include='/storage/**/.gitignore' --exclude='/storage/**' \
            --exclude='/public/hot' --exclude='/public/storage' \
            --exclude='/database/*.sqlite*' \
            "${items[@]}" dist/

      - name: Verify package
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ -f dist/public/build/manifest.json ] || fail "Pakette public/build/manifest.json yok."
          for dir in public/js/filament public/css/filament public/fonts/filament; do
            [ -n "$(ls -A "dist/$dir" 2>/dev/null)" ] || fail "Pakette $dir boş veya yok."
          done
          [ -f dist/.cpanel.yml ] || fail "Pakette .cpanel.yml yok."
          [ ! -e dist/.env ] || fail "Pakette .env var."
          [ ! -e dist/RELEASE ] || fail "Pakette RELEASE var; yayın adımında yazılır."
          [ -z "$(find dist/bootstrap/cache -mindepth 1 ! -name .gitignore)" ] || fail "Pakette bootstrap/cache önbelleği var."
          [ -z "$(find dist/storage -type f ! -name .gitignore)" ] || fail "Pakette storage içeriği var."

      # The hosting's clone of the repository tracks the production branch and pulls it
      # from cPanel. Files created on the hosting (.env, storage content, caches, the
      # .htaccess that routes requests to public/) are never committed.
      - name: Publish to production branch
        run: |
          printf '%s' "$GITHUB_SHA" > dist/RELEASE
          cat > dist/.gitignore <<'GITIGNORE'
          /.env
          /.htaccess
          /.ftp-deploy-sync-state.json
          /public/hot
          /public/storage
          error_log
          GITIGNORE

          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin production > /dev/null; then
            git fetch --depth=1 origin production
            git worktree add --detach release FETCH_HEAD
          else
            git worktree add --detach release
            git -C release checkout --orphan production
            git -C release rm -r -q --cached .
          fi

          rsync -a --delete --exclude='/.git' dist/ release/

          # Forced: package files that a vendor's own .gitignore matches must ship too.
          git -C release add --all --force .
          if git -C release diff --cached --quiet; then
            echo "production dalı zaten bu sürümde."
          else
            git -C release commit -q -m "Release $GITHUB_SHA"
          fi

          git -C release push origin HEAD:refs/heads/production
