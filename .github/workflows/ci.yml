name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A run on main may be uploading to the hosting; it is never cancelled halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: musteri_takip_testing
          MYSQL_USER: musteri_takip
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: musteri_takip
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install front-end dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Pint
        run: composer lint

      - name: Larastan
        run: composer analyse

      - name: Pest
        run: composer test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The job commits the built package to main.
    permissions:
      contents: write

    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Prepare environment
        run: cp .env.example .env

      # Composer scripts stay on: filament:upgrade writes Filament's public assets.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Install front-end dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Verify package
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ -f public/build/manifest.json ] || fail "public/build/manifest.json yok."
          for dir in public/js/filament public/css/filament public/fonts/filament; do
            [ -n "$(ls -A "$dir" 2>/dev/null)" ] || fail "$dir boş veya yok."
          done
          [ -f vendor/autoload.php ] || fail "vendor/autoload.php yok."

      # The hosting's clone of the repository tracks main and pulls it from cPanel, so the
      # built files are committed to main itself. Only these paths are added: .env, storage
      # content and caches never enter the commit. A newer push publishes its own package.
      - name: Commit package to main
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main bu çalışmadan sonra ilerledi; paketi yeni çalışma yayınlar."
            exit 0
          fi

          printf '%s' "$GITHUB_SHA" > RELEASE

          # Forced: the paths are ignored for local work, and a vendor's own .gitignore must not drop its files.
          git add --all --force vendor public/build public/js/filament public/css/filament public/fonts/filament RELEASE

          unexpected="$(git diff --cached --name-only | grep -Ev '^(vendor/|public/build/|public/(js|css|fonts)/filament/|RELEASE$)' || true)"
          [ -z "$unexpected" ] || fail "Pakette beklenmeyen dosyalar var: $unexpected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Paket $GITHUB_SHA [skip ci]"
          git push origin HEAD:refs/heads/main
