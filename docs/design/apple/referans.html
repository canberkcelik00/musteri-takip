    --fg: #f5f5f7; --muted: #a1a1a6; --faint: #8e8e93;

    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --win-shadow: 0 32px 80px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255, 255, 255, 0.16);

}

  --fg: #f5f5f7; --muted: #a1a1a6; --faint: #8e8e93;

  --accent: #0a84ff; --accent-tint: rgba(10, 132, 255, 0.24);
  --red-fg: #ff6961; --red-bg: rgba(255, 69, 58, 0.2);
  --amber-fg: #ffb340; --amber-bg: rgba(255, 159, 10, 0.2);
  --green-fg: #30d158; --green-bg: rgba(48, 209, 88, 0.2);
  --gray-fg: #a1a1a6; --gray-bg: rgba(235, 235, 245, 0.14);
  --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); --win-shadow: 0 32px 80px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255, 255, 255, 0.16);

* { box-sizing: border-box; }

.window { width: 100%; max-width: 1320px; height: min(900px, calc(100dvh - 40px)); min-height: 640px; background: var(--win); border-radius: 14px; box-shadow: var(--win-shadow); display: grid; grid-template-columns: 272px minmax(0, 1fr); overflow: hidden; }

.item:hover { background: var(--fill); }

.ico { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0; color: #fff; }
.ico svg { width: 15px; height: 15px; }
.c-blue { background: #0a84ff; } .c-indigo { background: #5e5ce6; } .c-orange { background: #ff9f0a; } .c-red { background: #ff453a; }
.c-green { background: #30b350; } .c-teal { background: #30a6b8; } .c-gray { background: #8e8e93; }
.bottom { margin-top: auto; }

/* Pane */
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.toolbar { position: sticky; top: 0; z-index: 5; height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding-inline: 28px; background: var(--bar); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-bottom: 1px solid var(--line); }
.search { flex: 0 1 340px; height: 32px; border-radius: 9px; background: var(--fill); display: flex; align-items: center; gap: 8px; padding-inline: 10px; color: var(--faint); font-size: 14px; min-width: 0; }
.search svg { width: 15px; height: 15px; flex-shrink: 0; }
.search input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--fg); }
.search input::placeholder { color: var(--faint); }
.search kbd { font: 500 11px var(--font); color: var(--faint); background: var(--fill); border-radius: 5px; padding: 1px 6px; }
.grow { flex: 1; }
.btn { height: 34px; padding-inline: 16px; border: 0; border-radius: 999px; background: var(--fill); font-weight: 600; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--fill-strong); }

.title p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

/* Cards */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--card-shadow); min-width: 0; }
.stat { padding: 16px 18px 18px; display: grid; gap: 2px; text-align: left; border: 0; width: 100%; color: inherit; }
.stat:hover { transform: translateY(-1px); }
.stat { transition: transform .15s ease; }
.stat .k { font-size: 13px; font-weight: 500; color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; margin-top: 4px; white-space: nowrap; }

.cols-task { grid-template-columns: minmax(0, 2.1fr) minmax(0, 1.5fr) 92px 110px 118px auto; }
.cols-cust { grid-template-columns: minmax(0, 2.4fr) 130px 120px 70px auto; }
.cols-debt { grid-template-columns: minmax(0, 2fr) minmax(0, 2fr) 96px 110px 126px; }

.num.over { color: var(--red-fg); }

.acts { display: flex; gap: 6px; justify-content: flex-end; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding-inline: 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.red { background: var(--red-bg); color: var(--red-fg); } .pill.amber { background: var(--amber-bg); color: var(--amber-fg); }
.pill.green { background: var(--green-bg); color: var(--green-fg); } .pill.gray { background: var(--gray-bg); color: var(--gray-fg); }
.tot { display: flex; justify-content: flex-end; gap: 28px; padding: 14px 18px; background: var(--fill); font-variant-numeric: tabular-nums; }

.scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: grid; place-items: center; padding: 16px; z-index: 50; }
.sheet { width: min(480px, 100%); background: var(--surface); border-radius: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); padding: 24px; display: grid; gap: 18px; max-height: calc(100dvh - 32px); overflow-y: auto; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
.fields { display: grid; background: var(--win); border-radius: 12px; }
.field { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 10px; padding: 0 14px; min-height: 46px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 1px; background: var(--line); }
.field label { color: var(--muted); }

.sheetact { display: flex; justify-content: flex-end; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--win); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 60; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }

  .tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--faint); padding: 4px 0; }
  .tabbar button svg { width: 24px; height: 24px; }

@media (max-width: 520px) {

  { who: 'Delta Gıda', desc: 'deltagida.com · SSL sertifikası', due: '26.10.2026', st: 'amber', stt: 'Yaklaşan', cur: 'USD', left: 120000 },
  { who: 'Mavi Kırtasiye', desc: 'mavikirtasiye.com · Hosting 2026', due: '28.10.2026', st: 'amber', stt: 'Yaklaşan', cur: 'TL', left: 400000 },
  { who: 'Plato Akademi', desc: 'platoakademi.org · Bakım 2026', due: '30.10.2026', st: 'amber', stt: 'Yaklaşan', cur: 'TL', left: 300000 },

];

/* ---------- Helpers ---------- */
function money(k, cur) {
  var whole = Math.trunc(k / 100), frac = String(k % 100).padStart(2, '0');
  return String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + frac + ' ' + cur;
}
function initials(s) { var p = s.split(' '); return (p[0][0] + (p[1] ? p[1][0] : p[0][1])).toUpperCase(); }
function cust(s) { return CUSTOMERS.filter(function (c) { return c.s === s; })[0]; }
function who(c) { return '<div class="who"><span class="av" style="background:' + c.c + '">' + initials(c.s) + '</span><div class="txt"><div class="nm">' + c.s + '</div><div class="sub">' + c.t + '</div></div></div>'; }
function pill(cls, t) { return '<span class="pill ' + cls + '">' + t + '</span>'; }
function debtText(d) { var o = []; for (var k in d) { o.push(money(d[k], k)); } return o.length ? o.join(' · ') : '—'; }

/* ---------- Menu ---------- */
var ITEMS = [
  { id: 'bugun', label: 'Bugün', g: 'g-today', c: 'c-blue' },
  { id: 'musteriler', label: 'Müşteriler', g: 'g-users', c: 'c-indigo' },
  { id: 'teklifler', label: 'Teklifler', g: 'g-doc', c: 'c-orange' },
  { group: 'Tahsilat' },
  { id: 'borclar', label: 'Açık borçlar', g: 'g-receipt', c: 'c-red' },
  { id: 'odemeler', label: 'Ödemeler', g: 'g-card', c: 'c-green' },
  { group: 'Katalog' },
  { id: 'hizmetler', label: 'Hizmetler', g: 'g-stack', c: 'c-teal' },
  { group: 'Ayarlar', bottom: true },
  { id: 'genel', label: 'Genel', g: 'g-gear', c: 'c-gray' },
  { id: 'yontemler', label: 'Ödeme yöntemleri', g: 'g-wallet', c: 'c-gray' },
  { id: 'sunucular', label: 'Sunucular', g: 'g-server', c: 'c-gray' }
];
var TABS = [['bugun', 'Bugün', 'g-today'], ['musteriler', 'Müşteriler', 'g-users'], ['borclar', 'Borçlar', 'g-receipt']];
var state = { view: 'bugun', filter: 'all', debtFilter: 'open', q: '' };

function renderNav() {
  var html = '', open = false;
  ITEMS.forEach(function (it) {
    if (it.group) { if (open) { html += '</div>'; } html += '<div class="group' + (it.bottom ? ' bottom' : '') + '"><div class="glabel">' + it.group + '</div>'; open = true; return; }
    if (!open) { html += '<div class="group">'; open = true; }
    html += '<button class="item" type="button" data-go="' + it.id + '"' + (state.view === it.id ? ' aria-current="page"' : '') + '><span class="ico ' + it.c + '"><svg><use href="#' + it.g + '"/></svg></span>' + it.label + '</button>';
  });
  document.getElementById('nav').innerHTML = html + '</div>';
  document.getElementById('tabbar').innerHTML = TABS.map(function (t) {
    return '<button type="button" data-go="' + t[0] + '"' + (state.view === t[0] ? ' aria-current="page"' : '') + '><svg><use href="#' + t[2] + '"/></svg>' + t[1] + '</button>';
  }).join('');
}

/* ---------- Views ---------- */
function viewBugun() {
  var tasks = [
    { c: 'Logi', topic: 'Alan adı yenileme borcu', date: '02.10.2026', st: pill('red', 'Gecikmiş'), amt: money(1240000, 'TL'), a: ['Ödeme al'], wa: true },
    { c: 'Ege Turizm', topic: 'Hosting 2026 borcu', date: '10.10.2026', st: pill('red', 'Gecikmiş'), amt: money(2150000, 'TL'), a: ['Ödeme al'], wa: true },
    { c: 'Delta Gıda', topic: 'SSL sertifikası borcu', date: '26.10.2026', st: pill('amber', 'Yaklaşan'), amt: money(120000, 'USD'), a: ['Ödeme al'], wa: true },
    { c: 'Mavi Kırtasiye', topic: 'Hosting 2026 borcu', date: '28.10.2026', st: pill('amber', 'Yaklaşan'), amt: money(400000, 'TL'), a: ['Ödeme al'], wa: true },
    { c: 'Plato Akademi', topic: 'Bakım 2026 borcu', date: '30.10.2026', st: pill('amber', 'Yaklaşan'), amt: money(300000, 'TL'), a: ['Ödeme al'], wa: true },
    { c: 'Kule Spor', topic: 'Hosting için ücretsiz devam kararı', date: '31.10.2026', st: pill('gray', 'Karar bekliyor'), amt: '—', a: ['Ücretsiz devam et', 'Ücretli yap'], wa: false }
  ];
  var rows = tasks.map(function (t) {
    var c = cust(t.c);
    return '<div class="row hov cols-task"><div class="c-who">' + who(c) + '</div><div class="c-topic sub" style="font-size:14px;color:var(--fg)">' + t.topic + '</div><div class="c-date date">' + t.date + '</div><div class="c-status">' + t.st + '</div><div class="c-amt num">' + t.amt + '</div><div class="acts">' +
      (t.wa ? '<button class="btn plain sm hide-sm" type="button">WhatsApp</button>' : '') +
      t.a.map(function (a, i) { return '<button class="btn sm ' + (i === 0 && t.a.length === 1 ? 'tint' : '') + '" type="button" data-pay="' + t.c + '">' + a + '</button>'; }).join('') + '</div></div>';
  }).join('');
  return '<div class="title"><div><h1>Bugün</h1><p>' + TODAY + '</p></div></div>' +
    '<div class="stats">' +
    '<button class="card stat" type="button" data-go="borclar"><span class="k">Toplam alacak</span><span class="v">49.500,00 <small>TL</small></span><span class="v">1.200,00 <small>USD</small></span><span class="s">6 açık borç</span></button>' +
    '<button class="card stat warn" type="button" data-go="borclar"><span class="k">Gecikmiş tutar</span><span class="v">33.900,00 <small>TL</small></span><span class="s">2 borç gecikmiş</span></button>' +
    '<button class="card stat" type="button" data-go="borclar"><span class="k">Bu ay vadesi gelen</span><span class="v">7.000,00 <small>TL</small></span><span class="v">1.200,00 <small>USD</small></span><span class="s">4 borç</span></button>' +
    '<button class="card stat" type="button" data-go="musteriler"><span class="k">30 gün içinde yenilenecek</span><span class="v">4 <small>hizmet</small></span><span class="s">3 müşteri</span></button>' +
    '</div>' +
    '<div class="listhead"><h2>Yapılacaklar</h2><span class="count">6 iş</span></div>' +
    '<div class="card list">' + rows + '</div>';
}

function viewMusteriler() {
  var q = state.q.toLowerCase();
  var list = CUSTOMERS.filter(function (c) {
    if (q && (c.s + ' ' + c.t).toLowerCase().indexOf(q) < 0) { return false; }
    if (state.filter === 'over') { return c.over; }
    if (state.filter === 'debt') { return Object.keys(c.debt).length > 0; }
    return true;
  }).sort(function (a, b) { return (b.over - a.over) || a.s.localeCompare(b.s, 'tr'); });
  var segs = [['all', 'Tümü'], ['over', 'Gecikmiş'], ['debt', 'Borcu olan']].map(function (s) {
    return '<button type="button" data-filter="' + s[0] + '" aria-pressed="' + (state.filter === s[0]) + '">' + s[1] + '</button>';
  }).join('');
  var rows = list.map(function (c) {
    var has = Object.keys(c.debt).length > 0;
    return '<div class="row hov cols-cust">' + who(c) + '<div class="num' + (c.over ? ' over' : '') + '">' + debtText(c.debt) + '</div><div class="c-ren date">' + c.ren + '</div><div class="c-n date" style="text-align:center">' + c.n + '</div><div class="acts">' + (has ? '<button class="btn sm tint" type="button" data-pay="' + c.s + '">Ödeme al</button>' : '') + '</div></div>';
  }).join('');
  return '<div class="title"><div><h1>Müşteriler</h1><p>Gecikmiş borcu olanlar üstte.</p></div><button class="btn tint hide-sm" type="button" data-newcust>Yeni müşteri</button></div>' +
    '<div class="listhead"><div class="seg" role="group" aria-label="Süzgeç">' + segs + '</div><span class="count">' + list.length + ' müşteri</span></div>' +
    '<div class="card list"><div class="row head cols-cust"><div>Müşteri</div><div style="text-align:right">Açık borç</div><div class="c-ren">En yakın yenileme</div><div class="c-n" style="text-align:center">Hizmet</div><div></div></div>' +
    (rows || '<div class="empty"><b>Eşleşen müşteri yok</b>Aramayı kısaltın ya da süzgeci "Tümü" yapın.</div>') + '</div>';
}

function viewBorclar() {
  var q = state.q.toLowerCase();
  var list = DEBTS.filter(function (d) { return !q || (d.who + ' ' + d.desc).toLowerCase().indexOf(q) >= 0; });
  if (state.debtFilter === 'over') { list = list.filter(function (d) { return d.st === 'red'; }); }
  var segs = [['open', 'Açık'], ['over', 'Gecikmiş']].map(function (s) {
    return '<button type="button" data-dfilter="' + s[0] + '" aria-pressed="' + (state.debtFilter === s[0]) + '">' + s[1] + '</button>';
  }).join('');
  var totals = {};
  list.forEach(function (d) { totals[d.cur] = (totals[d.cur] || 0) + d.left; });
  var rows = list.map(function (d) {
    var c = cust(d.who);
    return '<div class="row hov cols-debt">' + '<div>' + who(c).replace(c.t, c.t) + '</div>' + '<div class="c-desc sub" style="font-size:14px;color:var(--fg)">' + d.desc + '</div><div class="c-due date">' + d.due + '</div><div class="c-status">' + pill(d.st, d.stt) + '</div><div class="num' + (d.st === 'red' ? ' over' : '') + '">' + money(d.left, d.cur) + (d.of ? '<small>' + money(d.of, d.cur) + '\'den</small>' : '') + '</div></div>';
  }).join('');
  var tot = Object.keys(totals).map(function (k) { return '<span>Toplam ' + k + '<b style="color:var(--fg)">' + money(totals[k], k) + '</b></span>'; }).join('');
  return '<div class="title"><div><h1>Açık borçlar</h1><p>Para birimleri ayrı toplanır.</p></div></div>' +
    '<div class="listhead"><div class="seg" role="group" aria-label="Süzgeç">' + segs + '</div><span class="count">' + list.length + ' borç</span></div>' +
    '<div class="card list"><div class="row head cols-debt"><div>Müşteri</div><div class="c-desc">Açıklama</div><div class="c-due">Vade</div><div class="c-status">Durum</div><div style="text-align:right">Kalan</div></div>' +
    (rows || '<div class="empty"><b>Eşleşen borç yok</b>Aramayı kısaltın.</div>') + (tot ? '<div class="tot">' + tot + '</div>' : '') + '</div>';
}

function viewPlaceholder() {
  var it = ITEMS.filter(function (i) { return i.id === state.view; })[0];
  return '<div class="title"><div><h1>' + it.label + '</h1></div></div><div class="card"><div class="empty"><b>Bu ekran bu denemede çizilmedi</b>Bugün, Müşteriler ve Açık borçlar ekranlarına soldan geçebilirsiniz.</div></div>';
}

function render() {
  renderNav();
  var v = { bugun: viewBugun, musteriler: viewMusteriler, borclar: viewBorclar }[state.view] || viewPlaceholder;
  document.getElementById('view').innerHTML = v();
  try { history.replaceState(null, '', '#' + state.view); } catch (e) {}
}

/* ---------- Payment sheet ---------- */
var lastFocus = null;
function openPay(name) {
  lastFocus = document.activeElement;
  var opts = CUSTOMERS.map(function (c) { return '<option' + (c.s === name ? ' selected' : '') + '>' + c.s + '</option>'; }).join('');
  document.getElementById('overlay').innerHTML =
    '<div class="scrim" id="scrim"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="st"><h2 id="st">Ödeme al</h2>' +
    '<div class="fields">' +
    '<div class="field"><label for="f-c">Müşteri</label><select id="f-c">' + opts + '</select></div>' +
    '<div class="field"><label for="f-a">Tutar</label><input id="f-a" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>' +
    '<div class="field"><label>Para birimi</label><div class="seg" id="f-cur"><button type="button" aria-pressed="true">TL</button><button type="button" aria-pressed="false">USD</button></div></div>' +
    '<div class="field"><label for="f-m">Yöntem</label><select id="f-m"><option>Havale / EFT</option><option>Kredi kartı</option><option>Nakit</option></select></div>' +
    '<div class="field"><label for="f-d">Tarih</label><input id="f-d" value="23.10.2026"></div>' +
    '</div><div class="sheetact"><button class="btn" type="button" id="cancel">İptal</button><button class="btn primary" type="submit">Kaydet</button></div></form></div>';
  document.getElementById('f-a').focus();
}
function closePay() {
  document.getElementById('overlay').innerHTML = '';
  if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
}
function toast(t) {
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go],[data-pay],[data-filter],[data-dfilter],#pay,#cancel,#scrim,#f-cur button,[data-newcust],#newCustomer');
  if (!t) { return; }
  if (t.id === 'scrim') { if (e.target === t) { closePay(); } return; }
  if (t.id === 'cancel') { closePay(); return; }
  if (t.closest('#f-cur')) { t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === t)); }); return; }
  if (t.dataset.go) { state.view = t.dataset.go; render(); return; }
  if (t.dataset.filter) { state.filter = t.dataset.filter; render(); return; }
  if (t.dataset.dfilter) { state.debtFilter = t.dataset.dfilter; render(); return; }
  if (t.id === 'newCustomer' || t.hasAttribute('data-newcust')) { toast('Yeni müşteri penceresi bu denemede çizilmedi'); return; }
  openPay(t.dataset.pay || '');
});
document.addEventListener('submit', function (e) { e.preventDefault(); closePay(); toast('Ödeme kaydedildi · örnek ekran'); });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('scrim')) { closePay(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('q').addEventListener('input', function (e) {
  state.q = e.target.value;
  if (state.view === 'bugun') { state.view = 'musteriler'; }
  render();
});

var h = (location.hash || '').slice(1);
if (['bugun', 'musteriler', 'borclar'].indexOf(h) >= 0) { state.view = h; }
render();
</script>
